services:
  - type: web
    name: poem-generator
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    disk:
      name: poem-generator-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: SESSION_SECRET
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false
